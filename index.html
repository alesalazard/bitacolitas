<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Bitacolitas v7</title>

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link rel="apple-touch-icon" href="src/assets/icon.png" />
    <link rel="stylesheet" href="src/css/style.css" />
    <link rel="manifest" href="manifest.json" />

    <!-- DATABASE FIREBASE -->
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-firestore-compat.js"></script>

  </head>
  <body>
    <div class="menu-overlay" id="overlay" onclick="toggleMenu()"></div>
    <button class="menu-trigger" onclick="toggleMenu()">☰</button>

    <nav class="side-menu" id="sideMenu">
      <button class="menu-item" onclick="safeGoHome()">🏠 Ir al Inicio</button>
      <button class="menu-item" onclick="toggleTheme()">🌓 Cambiar Tema</button>
      <button class="menu-item" onclick="exportData()">
        💾 Descargar Backup JSON
      </button>
      <button
        class="menu-item"
        style="color: var(--danger)"
        onclick="clearAll()"
      >
        ⚠️ Borrar Todo
      </button>
      <button class="menu-item" onclick="auth.signOut()">
        🚪 Cerrar Sesión
      </button>

      <div class="dev-info">
        <strong>App realizada por AleCode®</strong> 2026
        <a href="mailto:alxsalazar21@gmail.com">alxsalazar21@gmail.com</a>
      </div>
    </nav>

    <div id="view-login" class="view active">
      <header class="header">
        <div class="img-icon">
          <img src="src/assets/icon.png" alt="icono-patita" class="emoji-paws" />
        </div>
        <h1 class="page-title">Bitacolitas</h1>
        <h4 class="page-subtitle">Ingresa a tus bitácoras</h4>
      </header>

      <div class="main-container">
        <div class="bio-box">
          <input
            type="email"
            id="loginEmail"
            placeholder="Correo electrónico"
          />
          <input type="password" id="loginPass" placeholder="Contraseña" />
          <button class="btn-action" onclick="handleAuth('login')">
            Iniciar Sesión
          </button>
          <button
            class="btn-action"
            style="
              background: none;
              border: 1px solid var(--border);
              margin-top: 10px;
            "
            onclick="handleAuth('register')"
          >
            Registrarse
          </button>
        </div>
        <div class="dev-info" style="text-align: center; margin-top: 2rem">
          <strong>App realizada por AleCode®</strong> 2026
          <a href="mailto:alxsalazar21@gmail.com">alxsalazar21@gmail.com</a>
        </div>
      </div>
    </div>
    <div id="view-home" class="view">
      <header class="header">
        <div class="img-icon">
          <img src="src/assets/icon.png" alt="icono-patita" class="emoji-paws" />
        </div>
        <h1 class="page-title">Bitacolitas</h1>
        <h4 class="page-subtitle">La bitácora de tus mascotas</h4>
      </header>
      <div class="main-container">
        <div id="petGrid" class="pet-grid"></div>
        <button
          class="btn-action"
          style="background: #444"
          onclick="showView('add')"
        >
          ➕ Nueva Bitácora peluda
        </button>
      </div>
    </div>

    <div id="view-detail" class="view">
      <header class="header">
        <button class="back-btn" onclick="safeGoHome()">← Inicio</button>
        <h1 class="page-title" id="detailPetName">Nombre</h1>
      </header>
      <div class="main-container">
        <div class="section-header">Biografía</div>
        <div class="bio-box" id="petBio"></div>
        <div class="section-header">Nuevo Registro</div>
        <div
          style="
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
          "
        >
          <button
            class="pet-card-btn"
            style="padding: 10px"
            onclick="openEventForm('Peso', '⚖️')"
          >
            Peso ⚖️
          </button>
          <button
            class="pet-card-btn"
            style="padding: 10px"
            onclick="openEventForm('Medicina', '💊')"
          >
            Medicinas 💊
          </button>
          <button
            class="pet-card-btn"
            style="padding: 10px"
            onclick="openEventForm('Vacuna', '💉')"
          >
            Vacunas 💉
          </button>
          <button
            class="pet-card-btn"
            style="padding: 10px"
            onclick="openEventForm('Vet', '🏥')"
          >
            Recomendaciones 🏥
          </button>
        </div>
        <div class="section-header">Historial Médico</div>
        <div id="detailLogs"></div>
        <button
          class="btn-action"
          style="background: var(--danger); opacity: 0.6; margin-top: 3rem"
          onclick="deletePet()"
        >
          Eliminar Peludo
        </button>
      </div>
    </div>

    <div id="view-add" class="view">
      <header class="header">
        <button class="back-btn" onclick="safeGoHome()">← Inicio</button>
        <h1 class="page-title">Perfil</h1>
      </header>
      <div class="main-container">
        <input
          type="text"
          id="petName"
          placeholder="Nombre"
          oninput="markDirty()"
        />
        <input type="date" id="petBirth" oninput="markDirty()" />Fecha de
        nacimiento
        <input
          type="text"
          id="petBreed"
          placeholder="Raza"
          oninput="markDirty()"
        />
        <input
          type="text"
          id="petColor"
          placeholder="Color"
          oninput="markDirty()"
        />
        <select id="petType" oninput="markDirty()">
          <option value="">Elige uno</option>
          <option value="Perro">Perro 🐶</option>
          <option value="Gato">Gato 🐱</option>
          <option value="Otro">Otro 🐰🐟🐦</option>
        </select>
        <textarea
          id="petNotes"
          placeholder="Breve Biografía:"
          style="height: 100px"
          oninput="markDirty()"
        ></textarea>
        <button class="btn-action" onclick="savePet()">Guardar Perfil</button>
      </div>
    </div>

    <div id="view-event" class="view">
      <header class="header">
        <button class="back-btn" onclick="safeGoProfile()">← Perfil</button>

        <h1 class="page-title" id="eventHeader">Registro</h1>
      </header>
      <div class="main-container">
        <input type="hidden" id="editingLogId" />
        <input type="date" id="eventDate" oninput="markDirty()" />
        <textarea
          id="eventNote"
          placeholder="Detalles..."
          style="height: 150px; margin-top: 15px"
          oninput="markDirty()"
        ></textarea>
        <button class="btn-action" id="btnSaveLog" onclick="saveLog()">
          Guardar
        </button>
      </div>
    </div>
    <script src="src/js/config.js"></script>
    <script src="src/js/main.js"></script>
  </body>
</html>
