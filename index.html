<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>PetHealth Pro v6.2</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icono.png">
    <link rel="manifest" href="manifest.json">
    
    <style>
        :root {
            --bg-body: #10161f;
            --bg-card: #1d2533;
            --text-primary: #ffffff;
            --text-secondary: #8b9bb4;
            --accent: #4a90e2;
            --border: #2a3547;
            --danger: #ff4d4f;
        }

        [data-theme="light"] {
            --bg-body: #f4f7f6;
            --bg-card: #ffffff;
            --text-primary: #1c252e;
            --text-secondary: #657786;
            --accent: #1da1f2;
            --border: #e1e8ed;
            --danger: #d9363e;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-primary);
            margin: 0; padding-bottom: 40px;
            transition: background 0.3s;
        }

        .header { padding: calc(2.5rem + env(safe-area-inset-top)) 1.5rem 1rem; position: relative; background: var(--bg-card); border-bottom: 1px solid var(--accent); }
        .page-title { font-size: 1.8rem; font-weight: 700; margin: 0; }
        
        /* Menú Hamburguesa */
        .menu-trigger {
            position: absolute; top: calc(2.5rem + env(safe-area-inset-top)); right: 1.5rem;
            background: none; border: none; color: var(--text-primary); font-size: 1.5rem; z-index: 1001;
        }

        .side-menu {
            position: fixed; top: 0; right: -280px; width: 280px; height: 100%;
            background: var(--bg-card); transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); z-index: 1002;
            padding: 80px 1.5rem 2rem; box-shadow: -10px 0 30px rgba(0,0,0,0.3);
            display: flex; flex-direction: column;
        }
        .side-menu.active { right: 0; }
        .menu-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); display: none; z-index: 1000;
        }
        .menu-overlay.active { display: block; }

        .menu-item {
            background: none; border: none; color: var(--text-primary);
            padding: 18px 0; text-align: left; font-size: 1rem;
            border-bottom: 1px solid var(--border); width: 100%; cursor: pointer;
        }
        .dev-info { margin-top: auto; padding-top: 20px; font-size: 0.75rem; color: var(--text-secondary); line-height: 1.4; }

        /* Contenedores */
        .main-container { padding: 0 1.5rem; }
        .section-header { color: var(--text-secondary); font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin: 1.5rem 0 0.5rem; }
        .pet-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 1rem; }
        .pet-card-btn { background: var(--bg-card); border: 1px solid var(--border); padding: 20px; border-radius: 20px; text-align: center; }
        .pet-avatar-large { font-size: 3rem; display: block; margin-bottom: 10px; }

        /* Perfil y Cards */
        .bio-box { background: var(--bg-card); border: 1px solid var(--border); padding: 1.2rem; border-radius: 16px; margin-bottom: 1.5rem; }
        .record-card { background: var(--bg-card); border: 1px solid var(--border); padding: 1rem; border-radius: 14px; margin-bottom: 10px; }
        
        .view { display: none; }
        .view.active { display: block; }
        .back-btn { background: none; border: none; color: var(--accent); font-weight: 600; margin-bottom: 10px; padding: 0; cursor: pointer; }
        
        input, select, textarea, .btn-action {
            width: 100%; padding: 1rem; border-radius: 12px; border: 1px solid var(--border);
            background: var(--bg-card); color: var(--text-primary); margin-top: 0.8rem; font-size: 1rem;
        }
        .btn-action { background: var(--accent); border: none; font-weight: bold; margin-top: 1.5rem; color: white; }
    </style>
</head>
<body>

    <div class="menu-overlay" id="overlay" onclick="toggleMenu()"></div>
    <button class="menu-trigger" onclick="toggleMenu()">☰</button>
    
    <nav class="side-menu" id="sideMenu">
        <button class="menu-item" onclick="safeGoHome()">🏠 Ir al Inicio</button>
        <button class="menu-item" onclick="toggleTheme()">🌓 Cambiar Tema</button>
        <button class="menu-item" onclick="exportData()">💾 Descargar Backup JSON</button>
        <button class="menu-item" style="color:var(--danger)" onclick="clearAll()">⚠️ Borrar Todo</button>
        
        <div class="dev-info">
            <strong>App realizada por AleCode®</strong> 2026
            <a href="mailto:alxsalazar21@gmail.com">alxsalazar21@gmail.com</a>
        </div>
    </nav>

    <div id="view-home" class="view active">
        <header class="header"><h1 class="page-title">Pet Health 🐾</h1></header>
        <div class="main-container">
            <div id="petGrid" class="pet-grid"></div>
            <button class="btn-action" style="background:#444" onclick="showView('add')">➕ Nuevo Peludo</button>
        </div>
        <img src="icono.png" alt="Mascota" style="width:90%; opacity:0.8; margin: 5rem auto 0; display:block">
    </div>

    <div id="view-detail" class="view">
        <header class="header">
            <button class="back-btn" onclick="safeGoHome()">← Inicio</button>
            <h1 class="page-title" id="detailPetName">Nombre</h1>
        </header>
        <div class="main-container">
            <div class="section-header">Biografía</div>
            <div class="bio-box" id="petBio"></div>
            <div class="section-header">Nuevo Registro</div>
            <div style="display:grid; grid-template-columns: repeat(4, 1fr); gap:10px">
                <button class="pet-card-btn" style="padding:10px" onclick="openEventForm('Medicina', '💊')">💊</button>
                <button class="pet-card-btn" style="padding:10px" onclick="openEventForm('Peso', '⚖️')">⚖️</button>
                <button class="pet-card-btn" style="padding:10px" onclick="openEventForm('Vacuna', '💉')">💉</button>
                <button class="pet-card-btn" style="padding:10px" onclick="openEventForm('Vet', '🏥')">🏥</button>
            </div>
            <div class="section-header">Historial Médico</div>
            <div id="detailLogs"></div>
            <button class="btn-action" style="background:var(--danger); opacity:0.6; margin-top:3rem" onclick="deletePet()">Eliminar Peludo</button>
        </div>
    </div>

    <div id="view-add" class="view">
        <header class="header"><h1 class="page-title">Perfil</h1></header>
        <div class="main-container">
            <input type="text" id="petName" placeholder="Nombre" oninput="markDirty()">
            <input type="date" id="petBirth" oninput="markDirty()">
            <input type="text" id="petBreed" placeholder="Raza" oninput="markDirty()">
            <input type="text" id="petColor" placeholder="Color" oninput="markDirty()">
            <select id="petType" oninput="markDirty()"><option value="Perro">Perro 🐶</option><option value="Gato">Gato 🐱</option></select>
            <textarea id="petNotes" placeholder="Comida, gustos, notas..." style="height:100px" oninput="markDirty()"></textarea>
            <button class="btn-action" onclick="savePet()">Guardar Perfil</button>
        </div>
    </div>

    <div id="view-event" class="view">
        <header class="header"><h1 class="page-title" id="eventHeader">Registro</h1></header>
        <div class="main-container">
            <input type="hidden" id="editingLogId">
            <input type="date" id="eventDate" oninput="markDirty()">
            <textarea id="eventNote" placeholder="Detalles..." style="height:150px; margin-top:15px;" oninput="markDirty()"></textarea>
            <button class="btn-action" id="btnSaveLog" onclick="saveLog()">Guardar</button>
        </div>
    </div>

    <script>
        let db = JSON.parse(localStorage.getItem('pet_db_v6')) || { pets: [], logs: [] };
        let currentPetId = null;
        let currentEventType = '';
        let isDirty = false; // Rastreador de cambios

        function toggleMenu() {
            document.getElementById('sideMenu').classList.toggle('active');
            document.getElementById('overlay').classList.toggle('active');
        }

        function markDirty() { isDirty = true; }

        function safeGoHome() {
            if (isDirty) {
                const proceed = confirm("Tienes información sin guardar. ¿Seguro que quieres volver al inicio y descartar los cambios?");
                if (!proceed) {
                    if(document.getElementById('sideMenu').classList.contains('active')) toggleMenu();
                    return;
                }
            }
            isDirty = false;
            showView('home');
        }

        function showView(viewId) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById('view-' + viewId).classList.add('active');
            if(document.getElementById('sideMenu').classList.contains('active')) toggleMenu();
            if(viewId === 'home') renderHome();
            if(viewId === 'detail') renderDetail();
        }

        function calculateAge(birthDate, refDate = new Date()) {
            const birth = new Date(birthDate);
            const ref = new Date(refDate);
            let age = ref.getFullYear() - birth.getFullYear();
            if (ref.getMonth() < birth.getMonth() || (ref.getMonth() === birth.getMonth() && ref.getDate() < birth.getDate())) age--;
            return age < 0 ? 0 : age;
        }

        function savePet() {
            const name = document.getElementById('petName').value;
            const birth = document.getElementById('petBirth').value;
            if(!name || !birth) return alert("Faltan datos obligatorios");
            
            db.pets.push({
                id: Date.now(), name, birth,
                breed: document.getElementById('petBreed').value || '-',
                color: document.getElementById('petColor').value || '-',
                type: document.getElementById('petType').value,
                notes: document.getElementById('petNotes').value || 'Sin notas'
            });
            saveDB();
            isDirty = false;
            showView('home');
        }

        function openEventForm(type, icon, logId = null) {
            currentEventType = type;
            document.getElementById('eventHeader').innerText = icon + " " + type;
            isDirty = false;
            if(logId) {
                const log = db.logs.find(l => l.id === logId);
                document.getElementById('editingLogId').value = logId;
                document.getElementById('eventDate').value = log.date;
                document.getElementById('eventNote').value = log.note;
            } else {
                document.getElementById('editingLogId').value = "";
                document.getElementById('eventDate').valueAsDate = new Date();
                document.getElementById('eventNote').value = "";
            }
            showView('event');
        }

        function saveLog() {
            const note = document.getElementById('eventNote').value;
            const date = document.getElementById('eventDate').value;
            const logId = document.getElementById('editingLogId').value;
            const pet = db.pets.find(p => p.id === currentPetId);
            const age = calculateAge(pet.birth, date);

            if(logId) {
                const idx = db.logs.findIndex(l => l.id == logId);
                db.logs[idx] = {...db.logs[idx], note, date, frozenAge: age};
            } else {
                db.logs.unshift({ id: Date.now(), petId: currentPetId, type: currentEventType, note, date, frozenAge: age });
            }
            saveDB();
            isDirty = false;
            showView('detail');
        }

        function renderHome() {
            const grid = document.getElementById('petGrid');
            grid.innerHTML = db.pets.map(p => `
                <div class="pet-card-btn" onclick="openPet(${p.id})">
                    <span class="pet-avatar-large">${p.type.includes('Gato') ? '🐱' : '🐶'}</span>
                    <strong>${p.name}</strong>
                </div>
            `).join('') || '<p style="color:gray">Presiona "+" para añadir.</p>';
        }

        function openPet(id) { currentPetId = id; showView('detail'); }

        function renderDetail() {
            const pet = db.pets.find(p => p.id === currentPetId);
            document.getElementById('detailPetName').innerText = pet.name;
            document.getElementById('petBio').innerHTML = `
                <div style="font-size:0.9rem">
                    <div><strong>Raza:</strong> ${pet.breed}</div>
                    <div><strong>Color:</strong> ${pet.color}</div>
                    <div><strong>Edad actual:</strong> ${calculateAge(pet.birth)} años</div>
                    <div style="margin-top:8px; color:var(--text-secondary)">${pet.notes}</div>
                </div>
            `;
            const logs = db.logs.filter(l => l.petId === currentPetId);
            document.getElementById('detailLogs').innerHTML = logs.map(l => `
                <div class="record-card">
                    <div style="display:flex; justify-content:space-between"><strong>${l.type}</strong><span>${l.frozenAge} años</span></div>
                    <p style="font-size:0.85rem; margin:8px 0">${l.note}</p>
                    <small style="color:var(--text-secondary)">${l.date}</small>
                    <div style="margin-top:10px">
                        <button onclick="openEventForm('${l.type}', '✏️', ${l.id})" style="background:none; border:none; color:var(--accent); font-size:0.7rem">EDITAR</button>
                        <button onclick="deleteLog(${l.id})" style="background:none; border:none; color:var(--danger); font-size:0.7rem; margin-left:10px">BORRAR</button>
                    </div>
                </div>
            `).join('') || '<p>Sin registros.</p>';
        }

        function deleteLog(id) { if(confirm("¿Borrar?")) { db.logs = db.logs.filter(l => l.id !== id); saveDB(); renderDetail(); } }
        function deletePet() { if(confirm("¿Borrar perfil?")) { db.pets = db.pets.filter(p => p.id !== currentPetId); db.logs = db.logs.filter(l => l.petId !== currentPetId); saveDB(); showView('home'); } }
        function saveDB() { localStorage.setItem('pet_db_v6', JSON.stringify(db)); }
        function toggleTheme() {
            const body = document.body;
            body.setAttribute('data-theme', body.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
            toggleMenu();
        }
        function exportData() {
            const blob = new Blob([JSON.stringify(db)], {type: "application/json"});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = "descargar_datos.json"; a.click();
            toggleMenu();
        }
        function clearAll() { if(confirm("¿Borrar TODO definitivamente?")) { localStorage.clear(); location.reload(); } }

        renderHome();
    </script>
</body>
</html>
